<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<style>
  :root{--bg:#000;--fg:#00ff6a;--dim:#1f9a54;--warn:#d8ff5c;--err:#ff5470;--line:#0d3a1f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:16px}
  #rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35;transition:opacity 1s}
  #wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;padding:14px 16px}
  #panel{flex:1;min-height:0;display:flex;flex-direction:column;transition:opacity 1s;
    background:rgba(0,0,0,.72);border:1px solid var(--line);padding:12px 14px;border-radius:4px}
  #panel.hide{opacity:0;pointer-events:none}
  #panel.glitch{animation:glitch .45s steps(2,end)}
  @keyframes glitch{
    0%{transform:translate(0)}
    20%{transform:translate(-5px,2px);filter:hue-rotate(70deg) saturate(2)}
    40%{transform:translate(5px,-2px)}
    60%{transform:translate(-3px,0);clip-path:inset(15% 0 45% 0)}
    80%{transform:translate(3px,1px);filter:hue-rotate(-60deg)}
    100%{transform:none;clip-path:none;filter:none}}
  #screen{flex:1;overflow-y:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
  .l{white-space:pre-wrap;word-break:break-word;margin:0 0 6px;line-height:1.45;text-shadow:0 0 6px rgba(0,255,106,.45)}
  .dim{color:var(--dim)} .warn{color:var(--warn)} .err{color:var(--err);text-shadow:none}
  .big{font-size:19px;letter-spacing:.05em}
  #bar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
  #bar span{color:var(--dim)}
  #in{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--fg);min-width:0}
  #in:disabled{opacity:.35}
  .hintbtn{font:inherit;background:none;border:1px solid var(--dim);color:var(--dim);padding:6px 10px;cursor:pointer}
  .hintbtn:disabled{opacity:.35}
  .pills{display:flex;gap:14px;margin:14px 0 6px;flex-wrap:wrap}
  .pill{font:inherit;font-weight:700;letter-spacing:.06em;border:0;padding:14px 20px;cursor:pointer;border-radius:999px;color:#fff}
  .pill.red{background:#d41f3a;box-shadow:0 0 18px rgba(212,31,58,.6)}
  .pill.blue{background:#1f5fd4;box-shadow:0 0 18px rgba(31,95,212,.6)}
  .pill:active{transform:scale(.97)}

  #snd{position:fixed;top:10px;right:12px;z-index:30;display:none;background:rgba(0,0,0,.6);
    border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:16px;cursor:pointer}

  /* llamada entrante */
  #phone{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;transition:opacity .7s;padding:20px}
  #phone.gone{opacity:0;pointer-events:none}
  .ringwrap{position:relative;width:120px;height:120px;margin-bottom:10px}
  .ringwrap i{position:absolute;inset:0;border:2px solid var(--fg);border-radius:50%;opacity:0;animation:ring 2s infinite}
  .ringwrap i:nth-child(2){animation-delay:.6s}
  .ringwrap i:nth-child(3){animation-delay:1.2s}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  .avatar{position:absolute;inset:22px;border-radius:50%;background:#031a0c;border:1px solid var(--fg);
    display:flex;align-items:center;justify-content:center;font-size:38px;animation:shake 1s infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}50%{transform:rotate(0)}}
  #phone .who{font-size:20px;letter-spacing:.12em}
  #phone .sub{color:var(--dim)}
  #phone .mutebtn{font:inherit;background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;padding:10px}
  @media (prefers-reduced-motion: reduce){ .ringwrap i,.avatar{animation:none} #panel.glitch{animation:none} }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<button id="snd" type="button" aria-label="Sonido">🔇</button>

<div id="phone">
  <div class="ringwrap"><i></i><i></i><i></i><div class="avatar">📞</div></div>
  <div class="who">NÚMERO DESCONOCIDO</div>
  <div class="sub">llamada entrante…</div>
  <button class="pill red" id="ansSound" type="button">CONTESTAR 🔊</button>
  <button class="mutebtn" id="ansMute" type="button">contestar sin sonido</button>
</div>

<div id="wrap">
  <div id="panel">
    <div id="screen" aria-live="polite"></div>
    <div id="bar">
      <span>&gt;</span>
      <input id="in" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Escribe aquí" disabled>
      <button class="hintbtn" id="hint" type="button" disabled>pista</button>
    </div>
  </div>
</div>

const screen = document.getElementById('screen');
const input  = document.getElementById('in');
const hintBtn = document.getElementById('hint');
const panel = document.getElementById('panel');
const sndBtn = document.getElementById('snd');
let stage = -1, tries = 0, hintIdx = 0, busy = true, totalErrors = 0;

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---- Sonido (Web Audio, sin archivos) ---- */
const sfx = {
  ctx: null, on: false, hum: null,
  init(){
    if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  enable(v){
    this.on = v;
    if (v){ this.init(); this.startHum(); } else this.stopHum();
    sndBtn.textContent = v ? '🔊' : '🔇';
  },
  tone(f, d=.08, type='square', vol=.04, when=0){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
  key(){ this.tone(900 + Math.random()*600, .025, 'square', .015); },
  pick(){ this.tone(440, .09, 'triangle', .06); },
  ok(){ this.tone(660, .12, 'sine', .07); this.tone(990, .22, 'sine', .07, .11); },
  bad(){ this.tone(110, .3, 'sawtooth', .06); this.tone(92, .3, 'sawtooth', .05, .08); },
  startHum(){
    if (this.hum || !this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.value = 52; g.gain.value = .02;
    o.connect(g); g.connect(this.ctx.destination); o.start(); this.hum = {o, g};
  },
  stopHum(){ if (this.hum){ try{ this.hum.o.stop(); }catch(e){} this.hum = null; } }
};
sndBtn.addEventListener('click', () => sfx.enable(!sfx.on));

/* ---- Utilidades de terminal ---- */
function line(text, cls=''){
  const p = document.createElement('div');
  p.className = 'l ' + cls; p.textContent = text;
  screen.appendChild(p); screen.scrollTop = screen.scrollHeight; return p;
}
async function type(text, cls='', speed=16){
  const p = line('', cls); let i = 0;
  for (const ch of text){
    p.textContent += ch; screen.scrollTop = screen.scrollHeight;
    if (i++ % 2 === 0 && ch.trim()) sfx.key();
    await sleep(speed);
  }
  return p;
}
async function progress(label, ms=1400){
  const p = line('', 'dim'); const steps = 24;
  for (let i=0;i<=steps;i++){
    p.textContent = label + ' [' + '█'.repeat(i) + '░'.repeat(steps-i) + '] ' + Math.round(i/steps*100) + '%';
    await sleep(ms/steps);
  }
}
function lock(v){ busy = v; input.disabled = v; hintBtn.disabled = v; if(!v) input.focus(); }
function glitch(){
  panel.classList.remove('glitch'); void panel.offsetWidth; panel.classList.add('glitch');
  setTimeout(() => panel.classList.remove('glitch'), 500);
}

/* ---- Llamada entrante ---- */
const phone = document.getElementById('phone');
function answerCall(withSound){
  if (withSound) sfx.enable(true);
  sfx.pick();
  phone.classList.add('gone');
  setTimeout(() => { phone.remove(); sndBtn.style.display = 'block'; boot(); }, 750);
}
document.getElementById('ansSound').addEventListener('click', () => answerCall(true));
document.getElementById('ansMute').addEventListener('click', () => answerCall(false));

/* ---- Intro: despertar + píldoras ---- */
async function boot(){
  lock(true);
  await sleep(500);
  await type('Línea segura establecida.', 'dim', 22);
  await sleep(700);
  await type('Despierta, Jesús…', 'big', 70);
  await sleep(900);
  await type('La Matrix te tiene.', 'big', 70);
  await sleep(900);
  await type('Sigue al conejo blanco.', 'big', 60);
  await sleep(900);
  await type('\nHay una puerta de salida, pero primero tienes que elegir.', 'dim', 22);
  showPills();
}
function showPills(){
  const row = document.createElement('div'); row.className = 'pills';
  const red = document.createElement('button'); red.className = 'pill red'; red.type = 'button'; red.textContent = 'PÍLDORA ROJA';
  const blue = document.createElement('button'); blue.className = 'pill blue'; blue.type = 'button'; blue.textContent = 'PÍLDORA AZUL';
  row.appendChild(red); row.appendChild(blue); screen.appendChild(row); screen.scrollTop = screen.scrollHeight;
  red.onclick = async () => { sfx.pick(); row.remove(); line('> píldora roja', 'dim'); await chooseRed(); };
  blue.onclick = async () => {
    sfx.bad(); glitch(); row.remove(); line('> píldora azul', 'dim');
    await type('Mañana despertarás en tu cama y creerás lo que quieras creer.\nQué aburrido. Esa opción no está disponible: vuelve a elegir.', 'err', 14);
    showPills();
  };
}
async function chooseRed(){
  await type('\nBuena elección. Esto va a ser un viaje.', '', 20);
  await progress('Conectando con la simulación', 1800);
  await type('\nHay 4 niveles de verificación.\nEscribe tu respuesta y pulsa Enter. Si te atascas, pulsa "pista".\n', 'dim', 8);
  nextStage();
}

/* ---- Niveles ---- */
async function nextStage(){
  stage++; tries = 0; hintIdx = 0;
  if (stage >= STAGES.length) return finale();
  const s = STAGES[stage];
  lock(true);
  await type('— ' + s.title + ' —', 'warn');
  await type(s.prompt, '', 12);
  lock(false);
}
async function answer(raw){
  if (busy || !raw.trim()) return;
  line('> ' + raw, 'dim'); input.value = '';
  const s = STAGES[stage]; if (!s) return;
  const n = norm(raw);
  lock(true);
  if (s.ok.includes(n)){
    await progress('Verificando', 700);
    sfx.ok();
    await type('✔ ' + s.done, '');
    await sleep(350); line('');
    nextStage();
  } else if (EGGS[n]){
    sfx.pick();
    await type(EGGS[n], 'warn', 14);
    lock(false);
  } else {
    tries++; totalErrors++;
    sfx.bad(); glitch();
    await type('✖ Error del sistema. Inténtalo de nuevo.', 'err', 10);
    if (totalErrors === 1 || totalErrors % 4 === 0){
      await sleep(250);
      await type('Déjà vu. Un gato negro acaba de pasar dos veces.', 'warn', 18);
    }
    if (tries >= 2 && hintIdx === 0) await type('(Si la necesitas, pulsa "pista")', 'dim', 6);
    lock(false);
  }
}
function giveHint(){
  if (busy || stage < 0 || stage >= STAGES.length) return;
  const h = STAGES[stage].hints;
  sfx.pick();
  line('PISTA: ' + h[Math.min(hintIdx, h.length-1)], 'warn');
  hintIdx++; input.focus();
}

/* ---- Final ---- */
async function finale(){
  lock(true);
  await progress('Abriendo la salida', 2400);
  sfx.ok();
  await type('\n✔ PROGRAMA COMPLETADO', 'big', 30);
  await sleep(900);
  panel.classList.add('hide');
  await sleep(1000);
  const lines = innerWidth < 640 ? REVEAL_TEXT_NARROW : REVEAL_TEXT_WIDE;
  await rain.reveal(lines);
  panel.classList.remove('hide');
  await sleep(1000);
  await type('\n' + FINAL_MESSAGE, '', 24);
  await sleep(400);
  const btn = document.createElement('button'); btn.className = 'pill red'; btn.type = 'button';
  btn.style.margin = '10px 0'; btn.textContent = '⬇ DESCARGAR RECOMPENSA';
  btn.onclick = download;
  screen.appendChild(btn); screen.scrollTop = screen.scrollHeight;
}
function download(){
  sfx.pick();
  if (!BOOK_B64){ alert('La recompensa aún no está incluida en este archivo.'); return; }
  const bin = atob(BOOK_B64); const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/epub+zip'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = BOOK_NAME;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

input.addEventListener('input', () => sfx.key());
input.addEventListener('keydown', e => { if (e.key === 'Enter') answer(input.value); });
hintBtn.addEventListener('click', giveHint);
document.addEventListener('click', e => { if(!busy && !e.target.closest('button')) input.focus(); });

/* ---- Lluvia de código (con modo "mensaje") ---- */
const rain = (function(){
  const c = document.getElementById('rain'), ctx = c.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789'.split('');
  const rc = () => chars[Math.floor(Math.random()*chars.length)];
  const FONT = 'Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
  let size = 16, stepMs = 55, cols = 0, rows = 0, drops = [], mask = null, locked = null, msgLines = null, last = 0, msgC = null, msgX = null, glyphs = [], fsCells = 0, crispStart = 0;

  function layout(){
    c.width = innerWidth; c.height = innerHeight;
    cols = Math.ceil(c.width / size); rows = Math.ceil(c.height / size);
    drops = Array.from({length: cols}, () => mask ? -Math.random()*25 : Math.random()*-50);
    if (mask) buildMask();
  }
  function buildMask(){
    const t = document.createElement('canvas'); t.width = cols; t.height = rows;
    const x = t.getContext('2d');
    const GAP = 0.16;                                   // separación entre letras (relativa al tamaño)
    const widthAt100 = l => { x.font = '700 100px ' + FONT;
      return [...l].reduce((w, ch) => w + x.measureText(ch).width, 0) + 100 * GAP * (l.length - 1); };
    const maxW = Math.max(...msgLines.map(widthAt100));
    const fs = Math.min(100 * (cols * 0.94) / maxW, rows / (msgLines.length * 1.6));
    x.font = '700 ' + fs + 'px ' + FONT; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#fff'; x.strokeStyle = '#fff'; x.lineWidth = Math.max(0.6, fs * 0.015); x.lineJoin = 'round';
    const lh = fs * 1.35, y0 = rows/2 - (msgLines.length - 1) * lh / 2;
    glyphs = []; fsCells = fs;
    msgLines.forEach((l, i) => {
      const ws = [...l].map(ch => x.measureText(ch).width);
      const total = ws.reduce((a, w) => a + w, 0) + fs * GAP * (l.length - 1);
      let px = cols/2 - total/2;
      [...l].forEach((ch, k) => {
        x.strokeText(ch, px + ws[k]/2, y0 + i*lh); x.fillText(ch, px + ws[k]/2, y0 + i*lh);
        glyphs.push({ch, x: px + ws[k]/2, y: y0 + i*lh});
        px += ws[k] + fs * GAP;
      });
    });
    const d = x.getImageData(0, 0, cols, rows).data;
    mask = []; locked = [];
    for (let r=0;r<rows;r++){
      mask[r] = []; locked[r] = [];
      for (let q=0;q<cols;q++){ mask[r][q] = d[(r*cols+q)*4+3] > 140; locked[r][q] = false; }
    }
    msgC = document.createElement('canvas'); msgC.width = c.width; msgC.height = c.height; msgX = msgC.getContext('2d');
  }
  function lockCell(row, col){
    locked[row][col] = true;
    msgX.font = 'bold ' + (size + 1) + 'px monospace';
    msgX.fillStyle = '#eafff2'; msgX.shadowColor = '#00ff6a'; msgX.shadowBlur = size * .35;
    msgX.fillText(rc(), col*size - 1, (row+1)*size);
  }
  function tick(now){
    requestAnimationFrame(tick);
    if (now - last < stepMs) return; last = now;
    ctx.fillStyle = 'rgba(0,0,0,' + (mask ? .2 : .08) + ')'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.font = size + 'px monospace'; ctx.fillStyle = mask ? '#12a652' : '#00ff6a';
    for (let i=0;i<cols;i++){
      const row = Math.floor(drops[i]);
      if (row >= 0 && row < rows){
        ctx.fillText(rc(), i*size, (row+1)*size);
        if (mask && mask[row][i] && !locked[row][i]) lockCell(row, i);
      }
      drops[i] += 1;
      if (!mask && drops[i] > rows && Math.random() > .975) drops[i] = 0;
    }
    if (mask){
      const k = crispStart ? Math.min(1, (now - crispStart) / 1200) : 0;
      ctx.globalAlpha = 1 - .65 * k; ctx.drawImage(msgC, 0, 0); ctx.globalAlpha = 1;
      if (k > 0){
        ctx.save(); ctx.globalAlpha = k;
        ctx.font = '700 ' + (fsCells * size) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#f2fff7'; ctx.shadowColor = '#00ff6a'; ctx.shadowBlur = 14;
        glyphs.forEach(g => ctx.fillText(g.ch, g.x * size, g.y * size));
        ctx.restore();
      }
    }
  }
  function reveal(lines){
    if (reduce) return Promise.resolve();
    msgLines = lines; size = innerWidth < 640 ? 5 : 8; stepMs = 30; mask = []; layout();
    c.style.opacity = 1; crispStart = 0;
    setTimeout(() => { crispStart = performance.now(); }, 5600);
    return new Promise(res => setTimeout(() => setTimeout(() => {
      c.style.opacity = .35; mask = null; locked = null; msgC = null; msgX = null; glyphs = []; crispStart = 0;
      size = 16; stepMs = 55; layout(); res();
    }, 3800), 7500));
  }
  layout(); addEventListener('resize', layout);
  if (!reduce) requestAnimationFrame(tick);
  return { reveal };
})();
</script>
